<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#f5c6b8"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="icon-180.png">
<title>SignClip</title>
<style>
:root{--bg:#faf9f7;--fg:#222;--mut:#8a8984;--card:#fff;--line:#e8e6e1;--hl:#ffe9a0;--rc:#f5c6b8;--sc:#b9d4ee;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171716;--fg:#eeece7;--mut:#8f8d87;--card:#222220;--line:#363633;--hl:#5f5010}}
:root[data-theme="dark"]{--bg:#171716;--fg:#eeece7;--mut:#8f8d87;--card:#222220;--line:#363633;--hl:#5f5010}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 system-ui,-apple-system,sans-serif}
#app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;border:4px solid var(--mc);border-radius:28px;transition:border-color .5s;position:relative;overflow:hidden}
#tb{display:flex;align-items:center;gap:8px;padding:10px 14px 6px;background:color-mix(in srgb,var(--mc) 45%,transparent)}
#ttl{font-size:20px;font-weight:500}#ml{margin-left:auto;font-size:10px;letter-spacing:.2em;color:var(--mut)}
.ib{width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--fg);font-size:18px}
#stage{position:relative;flex:0 0 auto;aspect-ratio:4/3;max-height:46%;background:#000;margin:8px 12px 0;border-radius:24px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.25);touch-action:none}
#stage video,#card{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam{transform:scaleX(-1)}.hide{opacity:0;pointer-events:none}
#card{display:none;flex-direction:column;justify-content:center;padding:18px;color:#fff}#card b{font-size:20px;margin-bottom:4px}
#bd{position:absolute;top:8px;left:12px;font-size:11px;color:#fff;background:rgba(0,0,0,.4);padding:2px 9px;border-radius:99px}
#fb{position:absolute;left:0;bottom:0;height:4px;background:#fff;width:0}
#ops{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center}
#ops button{border:0;border-radius:20px;background:var(--mc);color:#1d1b20;padding:11px 22px;font-size:14px;font-weight:500;box-shadow:0 2px 5px rgba(0,0,0,.4)}
#gh{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--mc);color:#1d1b20;padding:8px 16px;border-radius:12px;font-weight:500;font-size:14px;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#toast{position:absolute;top:36px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:4px 12px;border-radius:99px;font-size:12px;opacity:0;transition:.3s;white-space:nowrap;pointer-events:none}#toast.on{opacity:1}
#trk{display:none;height:26px;margin:6px 12px 0;gap:2px}
.sg{position:relative;border-radius:5px;overflow:hidden;opacity:.55;min-width:6px}.sg.c{opacity:1}
.sg i{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.4)}.sg u{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.6}
#ct{flex:1;overflow:auto;padding:6px 12px}
.it{background:var(--card);border-radius:16px;padding:11px 14px;margin:6px 0;box-shadow:0 1px 2px rgba(0,0,0,.12);user-select:none;-webkit-user-select:none}.it.cur{border-left:4px solid var(--mc)}
.it h4{margin:0;font-size:15px;font-weight:500}.it p{margin:1px 0;font-size:12px;color:var(--mut)}.it.dim{opacity:.55;box-shadow:none;border:1px dashed var(--line)}
.chip{display:inline-block;border:1px solid var(--mut);border-radius:8px;padding:3px 10px;font-size:12px;margin:2px 4px 2px 0;color:var(--mut)}
.cap{font-size:11px;letter-spacing:.12em;color:var(--mut);margin:6px 2px}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 2px}
#bar{position:relative;display:flex;gap:8px;padding:6px 12px 10px;align-items:center}
#in{flex:1;border:0;background:var(--card);color:var(--fg);border-radius:28px;padding:12px 18px;font-size:14px;outline:0;box-shadow:0 1px 3px rgba(0,0,0,.18);min-width:0}
#mic{width:44px;height:44px;border-radius:50%;border:0;background:var(--mc);font-size:16px}
#hist{position:absolute;bottom:100%;left:12px;right:12px;background:var(--card);border-radius:16px;display:none;padding:4px 0;z-index:6;box-shadow:0 2px 10px rgba(0,0,0,.25)}
#hist div{padding:8px 14px;color:var(--mut)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px 16px 26px;z-index:10;transform:translateY(105%);transition:transform .3s;box-shadow:0 -4px 20px rgba(0,0,0,.3)}.sheet.on{transform:none}
.sheet h2{font-size:18px;font-weight:500;margin:0 0 4px}.mut{color:var(--mut)}.sheet h3{margin:14px 0 4px;font-size:11px;letter-spacing:.12em;color:var(--mut)}
.sheet .it{background:var(--bg)}
.tile{display:flex;gap:14px;align-items:center;padding:12px 6px;border-radius:14px}.tile:active{background:var(--line)}.tile span{font-size:22px}.tile small{display:block;color:var(--mut)}
.map{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0 12px;text-align:center;font-size:11px}.map div{background:var(--line);border-radius:12px;padding:8px 4px}.map .c{background:var(--mc);color:#1d1b20;font-weight:500;display:flex;align-items:center;justify-content:center}
.row{border-top:1px solid var(--line);padding:8px 0;font-size:12px}.row b{font-size:13px}.row div{color:var(--mut)}
.sheet input[type=text],.sheet input[type=password],.sheet select{width:100%;padding:9px;margin:3px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.sheet label{display:block;margin:8px 0;color:var(--mut)}#bDir{padding:9px 14px;border:1px solid var(--line);border-radius:99px;background:var(--bg);color:var(--fg)}
#app{--lw:36%}#dv{display:none}
#app.rec #stage{flex:1;aspect-ratio:auto;max-height:none;margin:6px 12px 0}#app.rec #ct{flex:0 0 auto;max-height:20%}
#app.search{display:grid;grid-template-columns:var(--lw) 1fr;grid-template-rows:auto minmax(0,1fr) auto auto}
#app.search #tb,#app.search #bar{grid-column:1/3}#app.search #tb{grid-row:1}#app.search #bar{grid-row:4}
#app.search #ct{grid-column:1;grid-row:2/4;min-height:0}
#app.search #stage{grid-column:2;grid-row:2;aspect-ratio:auto;max-height:none;margin:6px 10px 0 4px;min-height:0}
#app.search #trk{grid-column:2;grid-row:3;margin:6px 10px 0 4px}
#app.search #dv{display:block;position:absolute;z-index:4;width:22px;height:64px;top:45%;left:calc(var(--lw) - 11px);border-radius:11px;background:var(--mc);box-shadow:0 1px 4px rgba(0,0,0,.3)}
#app.search[data-lw="0"] #ct .it p{display:none}#app.search[data-lw="0"] #ct .it{padding:8px 10px}
#ttl{cursor:pointer}#ttl small{font-size:11px;color:var(--mut);font-weight:400}
#mic{width:12px;height:12px;border-radius:50%;background:var(--mut);opacity:.5;margin-left:8px;flex:none}#mic.on{background:#5fbf92;opacity:1}
#toast{top:auto;bottom:62px}
#hn i{position:absolute;font-style:normal;font-size:11px;color:#fff;background:rgba(0,0,0,.38);padding:2px 9px;border-radius:99px;max-width:44%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
#hn .hu{top:40px;left:50%;transform:translateX(-50%)}#hn .hd{bottom:30px;left:50%;transform:translateX(-50%)}#hn .hl{left:8px;top:50%;transform:translateY(-50%)}#hn .hr{right:8px;top:50%;transform:translateY(-50%)}#hn .ht{top:8px;right:10px}#hn .hb{bottom:8px;left:50%;transform:translateX(-50%)}#hn .hc{top:calc(50% + 48px);left:50%;transform:translateX(-50%)}
#pp{position:absolute;top:50%;left:50%;width:68px;height:68px;margin:-34px 0 0 -34px;border-radius:50%;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:opacity .2s;opacity:0}
#stage.fs{position:fixed!important;inset:0;z-index:30;margin:0!important;border-radius:0;max-height:none;aspect-ratio:auto}
.it{touch-action:pan-y}.it.main{background:color-mix(in srgb,var(--rc) 40%,var(--card))}.it.armed{background:#f4b8b8;transition:none}
.i{fill:currentColor;vertical-align:middle;flex:none}
#ttl{font-size:22px;font-weight:400}#ttl small{display:inline-flex;align-items:center}
#mic{width:auto;height:auto;border-radius:0;background:none;color:var(--mut);opacity:.55;display:flex}#mic.on{background:none;color:#3f9d78;opacity:1}
.tile span{display:flex}.tile span svg{width:24px;height:24px}
#pp{width:72px;height:72px;margin:-36px 0 0 -36px;background:var(--mc);color:#1d1b20;box-shadow:0 3px 8px rgba(0,0,0,.35);-webkit-backdrop-filter:none;backdrop-filter:none}
#hn i{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-size:12px;padding:5px 11px;max-width:40%}
#hn .hu{top:auto;bottom:calc(50% + 54px);left:50%;transform:translateX(-50%)}
#hn .hd{bottom:auto;top:calc(50% + 54px);left:50%;transform:translateX(-50%)}
#hn .hl{left:auto;top:50%;right:calc(50% + 50px);transform:translateY(-50%)}
#hn .hr{right:auto;top:50%;left:calc(50% + 50px);transform:translateY(-50%)}
#hn .hc{top:calc(50% + 92px);bottom:auto;left:50%;transform:translateX(-50%);background:none;-webkit-backdrop-filter:none;backdrop-filter:none;opacity:.85}
#hk{position:absolute;top:36px;left:50%;transform:translateX(-50%);max-width:86%;background:var(--mc);color:#1d1b20;font-size:12px;font-weight:500;padding:5px 14px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;display:none}
#trk{touch-action:none}
#app.search #trk{grid-column:1;grid-row:2/4;justify-self:start;width:18px;margin:6px 0 0 6px;flex-direction:column;z-index:3}
#trk .sg{min-width:0;min-height:6px}#trk .sg i{inset:0 0 auto 0;width:auto;height:0}
#trk .sg u{top:auto;bottom:auto;left:0;right:0;width:auto;height:2px}
#app.search #ct{padding-left:30px}#app.search #fb{display:none}
#app.search.tall #stage{grid-row:1/5;margin:8px 10px 8px 4px}
#app.search.tall #tb,#app.search.tall #bar{grid-column:1}#app.search.tall #ttl small,#app.search.tall #ml{display:none}
</style></head><body>
<div id="app"><header id="tb"><span id="ttl">SignClip <small>Steuerung<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></small></span><span id="ml"></span><span id="mic"></span></header>
<div id="stage"><video id="cam" muted playsinline></video><video id="pv" playsinline style="display:none"></video><div id="card"></div>
<div id="bd"></div><div id="gh"></div><div id="toast"></div><div id="fb"></div><div id="hk"></div><div id="hn"></div><div id="pp"></div><div id="ops"></div></div>
<div id="trk"></div><div id="ct"></div><div id="dv"></div>
<div id="bar"><div id="hist"></div><input id="in" enterkeyhint="send" autocomplete="off"></div>
<div id="hs" class="sheet"></div><div id="ss" class="sheet"></div>
<div id="sh" class="sheet"><h2>Einstellungen</h2><p class="mut">Nach unten wischen zum Schließen</p>
<h3>SPEICHERN</h3><button id="bDir">Ordner auf dem Gerät wählen</button><span id="dirN" class="mut"></span>
<input type="text" id="dUrl" placeholder="Nextcloud / Sciebo WebDAV-URL"><input type="text" id="dUser" placeholder="Benutzername"><input type="password" id="dPw" placeholder="App-Passwort (wird nicht gespeichert)">
<p class="mut">Sciebo: https://HOCHSCHULE.sciebo.de/remote.php/webdav/ · Nextcloud: https://HOST/remote.php/dav/files/BENUTZER/</p>
<label><input type="checkbox" id="aSave"> Automatisch speichern</label>
<h3>STEUERUNG</h3><label><input type="checkbox" id="auto"> Auto-Start bei Bewegung</label>
<label>Freeze-Stopp nach <select id="frz"><option>1.5</option><option selected>2</option><option>3</option></select> Sekunden</label><label>Kontext-Pause startet die Aufnahme nach <select id="wst"><option value="0">aus</option><option selected>3</option><option>5</option></select> Sekunden</label></div></div>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),D=864e5;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const rel=d=>{const n=Math.round((Date.now()-d)/D);return n<1?'heute':n==1?'gestern':'vor '+n+' Tagen'};
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let wt,N=10,mode='rec',busyT=null,lastMerge=null,afterFin=null,ssc=null,ssOpen=false,noteTgt=null,hist=ls.get('hist',[]);
let clips=[
{id:1,title:'Heizungsraum Müller',date:Date.now()-2*D,dur:6,hue:20,ctx:[{t:0,m:1,x:'Baustelle Müller Heizungsraum, Rohr undicht'}],mk:[3]},
{id:2,title:'Arzt Anmeldung',date:Date.now()-5*D,dur:5,hue:200,ctx:[{t:0,m:1,x:'Arzttermin Praxis, Anmeldung am Empfang'}],mk:[]},
{id:3,title:'Geburtstag Garten',date:Date.now()-9*D,dur:7,hue:140,ctx:[{t:0,m:1,x:'Familie Geburtstag, Kuchen im Garten'}],mk:[2]},
{id:4,title:'Keller Müller',date:Date.now()-2.2*D,dur:5,hue:290,ctx:[{t:0,m:1,x:'Baustelle Müller Keller, Rohrbruch Wasser am Boden'}],mk:[]},
{id:5,title:'Bahnhof Verspätung',date:Date.now()-1*D,dur:4,hue:50,ctx:[{t:0,m:1,x:'Bahnhof Fahrplan, Zug hat Verspätung'}],mk:[]}];
const G=[['keller','heizungsraum','untergeschoss'],['rohr','rohrbruch','undicht','wasser'],['arzt','praxis','termin','anmeldung'],['familie','geburtstag','kuchen','garten'],['bahn','bahnhof','zug','fahrplan','verspätung']];
const STOP=new Set(['und','der','die','das','alle','videos','video','mit','vom','von','zum','zeig','mir']);
const txt=c=>(c.title+' '+c.ctx.map(x=>x.x).join(' ')).toLowerCase();
function match(c,term){const T=txt(c);let score=0;const words=[];
 term.toLowerCase().split(/[\s,]+/).filter(w=>w.length>2&&!STOP.has(w)).forEach(w=>{const st=v=>v.length>5?v.slice(0,-1):v;
  if(T.includes(st(w))){score+=2;words.push(st(w))}else{const g=G.find(g=>g.some(x=>x.startsWith(w.slice(0,4))));if(g)g.forEach(v=>{if(T.includes(st(v))){score++;words.push(st(v))}})}});
 return{score,words}}
function hl(s,ws){if(!ws.size)return esc(s);return esc(s).replace(new RegExp('('+[...ws].map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')\\w*','gi'),'<mark>$&</mark>')}
const cam=$('#cam'),pv=$('#pv'),card=$('#card');let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)}

// ================= AKTIONEN (EINE Tabelle) =================
// [id, Name, run(arg), Sprach-Regex, Kamera-Geste, Wartezeit]
// Neue Aktion = eine Zeile hier + ein Eintrag in MAP. Hilfe und Sprache entstehen automatisch.
const ACT=[
['start','Start',()=>{if(!rec)start();else if(rec.paused)togglePause()},/^(start|los)\b/,'Bewegung im Bild','Autostart: 0,5 s Bewegung'],
['startPause','Start / Pause (Tippen)',()=>rec?togglePause():start(),null,'',''],
['pause','Pause',()=>{if(rec)togglePause()},/^pause\b/,'',''],
['autostart','Autostart an/aus',()=>{const c=$('#auto');c.checked=!c.checked;toast('Autostart '+(c.checked?'an':'aus'));ui()},null,'',''],
['stopp','Speichern + Nächstes',()=>{if(rec){afterFin=()=>{pending=[];render()};stop()}},/^(stopp|stop|ende|speichern)\b/,'Hände still (Freeze)','Freeze 1,5–3 s'],
['marker','Marker',()=>marker(),/^marker\b/,'Flache Hand (geplant)','−1 s rückwirkend'],
['schnitt','Schnitt',()=>schnitt(),/^(schnitt|teilen|trenner)\b/,'Hände kreuzen (geplant)','in der Suche: Wisch nach links'],
['weiter','Weiter',()=>weiter(),/^weiter\b/,'Handwisch (geplant)',''],
['nochmal','Retry',()=>restart(false),/^(nochmal|retry)\b/,'',''],
['neu','Zurücksetzen',()=>neu(),/^neu\b/,'',''],
['vertikal','Video vertikal groß',()=>{if(mode==='search')$('#app').classList.toggle('tall')},/^(größer|vertikal|groß)\b/,'','Halten auf der Positionsleiste'],
['seek','Position ändern',()=>toast('Auf der Positionsleiste tippen oder ziehen'),null,'',''],
['vollbild','Vollbild an/aus',()=>$('#stage').classList.toggle('fs'),/^vollbild\b/,'','Doppelt tippen'],
['zurueck','Vorheriger Clip',()=>{if(idx>0)play(idx-1)},/^zurück\b/,'',''],
['playpause','Abspielen / Pause',()=>{if(ended&&pl.length){play(0);return}if(!cur())return;playing=!playing;if(cur().url){playing?pv.play():pv.pause()}toast(playing?'Weiter':'Pause')},null,'',''],
['aufnahme','Zur Aufnahme',()=>setMode('rec'),/^aufnahme\b/,'',''],
['modus','Modus wechseln',()=>{if(!rec)setMode(mode==='rec'?'search':'rec')},null,'Hand wischt durchs Bild',''],
['sucheAlle','Suche (alle)',()=>toSearch(true),/^suche alle\b/,'',''],
['suchTerm','Suchbegriff',m=>addTerm(m[1]),/^suche (.+)/,'','Satzende ca. 1,2 s'],
['suche1','Suche (dieses)',()=>toSearch(false),/^suche\b/,'',''],
['ende','Ans Ende anhängen',m=>addTerm(m[1],true),/^ans ende (.+)/,'',''],
['playlist','Playlist ansehen',()=>openPl(),/^playlist\b/,'',''],
['ergaenzen','Kontext ergänzen',()=>addMore(),/^ergänzen\b/,'',''],
['zusammen','Zusammenfügen',()=>merge(),/^zusammen/,'','läuft in Clip-Länge'],
['teilen','Teilen',()=>teilen(),/^(senden|share)\b/,'',''],
['notizSp','Notiz zum laufenden Clip',m=>note(m[1]),/^notiz (.+)/,'',''],
['zu','Sheet schließen',()=>closeSheets(),/^(schließen|fertig)\b/,'','oder nach unten wischen'],
['alsNaechstes','Eintrag als Nächstes',i=>nextUp(i),null,'',''],
['entfernen','Eintrag entfernen',i=>plRm(i),null,'',''],
['notiz','Notiz zu Eintrag',i=>noteFor(i),null,'','nächster Satz geht an den Eintrag'],
['teilenClip','Einzelnen Clip teilen',i=>openShare(pl[i].c),null,'','']];
const A=Object.fromEntries(ACT.map(a=>[a[0],a]));
// Wisch-Belegung: Kontext → Richtung → [kurz, lang]
const MAP={
 idle:{'tipp':['start'],'halten':['autostart'],'↑':['start'],'Rand↑':['sucheAlle'],'Rand↓':['neu']},
 rec:{'tipp':['pause'],'↓':['nochmal'],'Rand↓':['neu'],'↑':['stopp'],'←':['weiter'],'→':['teilen'],'Rand↑':['suche1']},
 search:{'←':['schnitt'],'→':['teilen'],'↑':['weiter'],'↓':['zurueck'],'tipp':['playpause'],'halten':['marker'],'doppelt':['vollbild'],'Rand↓':['aufnahme']},
 all:{'←':['aufnahme','aufnahme'],'→':['aufnahme','aufnahme'],'↓':[null,'aufnahme'],'Rand↓':['aufnahme']},
 strip:{'tippen/ziehen':['seek'],'halten':['vertikal']},
 item:{'→':['alsNaechstes'],'halten ←':['entfernen'],'halten':['notiz'],'doppelt':['teilenClip']}};
const CN={strip:'Positionsleiste',idle:'Kontextphase',rec:'Aufnahme',search:'Suche',all:'Alle Clips',item:'Eintrag'};
const runAct=(id,a)=>A[id]&&A[id][2](a);
const CTX=()=>mode==='rec'?(rec?'rec':'idle'):(!pl.length&&!terms.length?'all':'search');
function swAct(dx,dy,W,H){const ax=Math.abs(dx),ay=Math.abs(dy),h=ax>ay,a=h?ax:ay;if(a<40)return null;
 const full=a>(h?W:H)*.38,d=h?(dx<0?'←':'→'):(dy<0?'↑':'↓'),l=(MAP[CTX()]||{})[d]||[],id=l.length===1?l[0]:l[full?1:0];
 return id?{n:A[id][1],f:()=>runAct(id)}:null}
function bindSw(el,only){let g=null;const gh=$('#gh');
 el.addEventListener('touchstart',e=>{g={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
 const calc=e=>{if(!g)return null;const t=(e.changedTouches||e.touches)[0],dx=t.clientX-g.x,dy=t.clientY-g.y;if(only&&!(only()&&Math.abs(dx)>Math.abs(dy)*2))return null;return swAct(dx,dy,el.clientWidth,el.clientHeight)};
