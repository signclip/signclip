<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1080,"height":1350}}'>
class Component extends DCLogic {
renderVals() {
let d = '';
let i = 0;
for (let x = 542; x <= 668; x += 8) {
const h = Math.round(Math.abs(Math.sin(i * 0.6) * Math.cos(i * 0.23)) * 20 + 3);
d += 'M' + x + ' ' + (638 - h) + ' V' + (638 + h) + ' ';
i++;
}
return { wave: d };
}
}
